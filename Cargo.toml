[workspace]
members = [
  "crates/oauthrelay-core",
  "crates/oauthrelay-secret-resolver",
  "crates/oauthrelay-provider-file",
  "crates/oauthrelay-provider-ssm",
  "crates/oauthrelay-provider-kubernetes",
  "crates/oauthrelay",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/rise-deploy/oauthrelay"
rust-version = "1.89"

[workspace.dependencies]
anyhow = "1"
arc-swap = "1"
async-trait = "0.1"
aws-config = "1"
aws-sdk-secretsmanager = "1"
aws-sdk-ssm = "1"
axum = "0.8"
base64 = "0.22"
chacha20poly1305 = "0.10"
http-body-util = "0.1"
futures = "0.3"
kube = { version = "4.2", default-features = false, features = ["client", "config", "derive", "runtime", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["v1_35"] }
jsonwebtoken = "9"
lambda_http = "0.17"
postcard = { version = "1", features = ["use-std"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
serde_yaml = "0.9"
serde-saphyr = "0.0.29"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "fs"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = { version = "2", features = ["serde"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
