name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [develop, main]
    tags: ["v*"]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  PUBLISH: ${{ github.event_name == 'push' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'preview')) }}

jobs:
  docs:
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - name: Build documentation
        uses: withastro/action@v6
        with:
          path: docs
          node-version: 24.19.0

  deploy-docs:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: docs
    concurrency:
      group: github-pages
      cancel-in-progress: true
    permissions:
      pages: write
      id-token: write
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish documentation
        id: deployment
        uses: actions/deploy-pages@v5

  rust:
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Mount Cargo build cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: cargo-target-rust-1-97-1-${{ runner.arch }}
          path: target
      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: cargo-downloads-${{ runner.os }}-${{ runner.arch }}-
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: mise run features:check
      - name: Test workspace and documentation examples
        run: cargo test --workspace --all-features
      - run: mise run schema:check
      - run: mise run crds:check

  e2e:
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - uses: useblacksmith/setup-docker-builder@v1
        with:
          max-cache-size-mb: "10240"
      - run: mise run e2e

  kubernetes:
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
      - name: Mount Cargo build cache
        uses: useblacksmith/stickydisk@v1
        with:
          key: cargo-target-kubernetes-rust-1-97-1-${{ runner.arch }}
          path: target
      - run: mise run crds:check
      - run: mise run kubernetes:test

  image:
    if: github.event.action != 'labeled' || github.event.label.name == 'preview'
    name: image (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: blacksmith-8vcpu-ubuntu-2404
            platform: linux/amd64
          - architecture: arm64
            runner: blacksmith-8vcpu-ubuntu-2404-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: oauthrelay-${{ matrix.architecture }}
      - uses: useblacksmith/build-push-action@v2
        id: build
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.metadata.outputs.labels }}
          outputs: ${{ env.PUBLISH == 'true' && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE) || '' }}
      - name: Export digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.architecture }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'preview')
    needs: image
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: useblacksmith/setup-docker-builder@v2
      - uses: docker/metadata-action@v6
        id: metadata
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=tag
      - name: Create manifest
        env:
          TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          set -euo pipefail

          tag_args=()
          while IFS= read -r tag; do
            tag_args+=(--tag "$tag")
          done <<< "$TAGS"

          sources=()
          for digest in "${{ runner.temp }}/digests/"*; do
            sources+=("${IMAGE}@sha256:$(basename "$digest")")
          done

          docker buildx imagetools create "${tag_args[@]}" "${sources[@]}"
      - name: Inspect manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.metadata.outputs.version }}"
