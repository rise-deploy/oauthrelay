[tools]
actionlint = "1.7.12"
aws-cli = "2.36.24"
docker-cli = "29.7.2"
kind = "0.33.0"
kubectl = "1.35.0"
node = "24.19.0"
rust = { version = "1.97.1", components = ["rustfmt", "clippy"] }
shellcheck = "0.11.0"

[tasks.check]
description = "Run all local quality gates"
run = [
  "actionlint",
  "cargo fmt --all -- --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "mise run features:check",
  "cargo test --workspace --all-features",
  "mise run schema:check",
  "mise run crds:check",
  "mise run scripts:test",
  "mise run docs",
]

[tasks.docs]
description = "Build the documentation site"
dir = "docs"
run = "npm ci && npm run build"

[tasks.schema]
description = "Generate the oauthrelay configuration schema"
run = "cargo run -q -p oauthrelay -- schema > docs/public/oauthrelay.schema.json"

[tasks."schema:check"]
description = "Check the generated oauthrelay configuration schema"
run = "cargo run -q -p oauthrelay -- schema | diff -u docs/public/oauthrelay.schema.json -"

[tasks."features:check"]
description = "Check standalone binary feature combinations"
run = [
  "cargo check -p oauthrelay --no-default-features",
  "cargo check -p oauthrelay --no-default-features --features aws",
  "cargo check -p oauthrelay --no-default-features --features lambda",
  "cargo check -p oauthrelay --no-default-features --features kubernetes",
  "cargo check -p oauthrelay --no-default-features --features kubernetes,aws",
  "cargo check -p oauthrelay --no-default-features --features kubernetes,lambda",
]

[tasks."docs:serve"]
description = "Serve the documentation site locally"
dir = "docs"
run = "npm ci && npm run dev"

[tasks.e2e]
description = "Run Docker-backed end-to-end tests"
run = "bash tests/e2e/run.sh"

[tasks."e2e:aws-google"]
description = "Verify a published oauthrelay image with AWS Lambda and Google OAuth"
run = "node scripts/aws-google-relay-e2e.mjs"

[tasks."scripts:test"]
description = "Run orchestration script tests"
run = "node --test scripts/*.test.mjs"

[tasks.crds]
description = "Generate the Kubernetes CRDs from Rust types"
run = "cargo run -q -p oauthrelay --no-default-features --features kubernetes -- crds > deploy/oauthrelay.crds.yaml"

[tasks."crds:check"]
description = "Check the generated Kubernetes CRDs"
run = "cargo run -q -p oauthrelay --no-default-features --features kubernetes -- crds | diff -u deploy/oauthrelay.crds.yaml -"

[tasks."kubernetes:test"]
description = "Validate CRDs and provider behavior in a disposable Kind cluster"
run = "python3 tests/kubernetes/run.py"
