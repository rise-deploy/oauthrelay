[package]
name = "oauthrelay-store-dynamodb"
description = "Amazon DynamoDB transient store for oauthrelay"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["aws"]
aws = ["dep:aws-sdk-dynamodb"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-sdk-dynamodb = { workspace = true, optional = true }
oauthrelay-core = { path = "../oauthrelay-core" }

[dev-dependencies]
aws-sdk-dynamodb = { workspace = true, features = ["behavior-version-latest"] }
aws-smithy-http-client = { version = "1", features = ["test-util"] }
http = "1"
serde_json.workspace = true
tokio.workspace = true
