[package]
name = "oauthrelay"
description = "Standalone oauthrelay server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["aws", "lambda", "kubernetes"]
kubernetes = ["dep:kube", "dep:oauthrelay-provider-kubernetes"]
aws = [
  "dep:async-trait",
  "dep:aws-config",
  "dep:aws-sdk-secretsmanager",
  "dep:aws-sdk-ssm",
  "dep:oauthrelay-provider-ssm",
  "oauthrelay-provider-ssm/aws",
]
lambda = ["dep:lambda_http"]

[dependencies]
kube = { workspace = true, optional = true }
oauthrelay-provider-kubernetes = { path = "../oauthrelay-provider-kubernetes", optional = true }
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-secretsmanager = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
axum.workspace = true
base64.workspace = true
lambda_http = { workspace = true, optional = true }
oauthrelay-core = { path = "../oauthrelay-core" }
oauthrelay-provider-file = { path = "../oauthrelay-provider-file" }
oauthrelay-provider-ssm = { path = "../oauthrelay-provider-ssm", default-features = false, optional = true }
reqwest.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[[bin]]
name = "oauthrelay"
path = "src/main.rs"

[dev-dependencies]
jsonwebtoken.workspace = true
serde.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tempfile = "3"
